# Threshold ECDSA Specification
# ICP Chain-Key Signatures for EVM Transaction Signing

[definitions]
module_self = "ThresholdECDSA"

# =============================================================================
# Key Management
# =============================================================================

[[spec]]
id = "REQ_ECDSA_KEY_001"
description = "Support secp256k1 curve for ECDSA operations"
priority = "high"
tags = ["key", "curve"]

[[spec]]
id = "REQ_ECDSA_KEY_002"
description = "Support production key (key_1) with 34-node subnet"
priority = "high"
tags = ["key", "production"]

[[spec]]
id = "REQ_ECDSA_KEY_003"
description = "Support test key (test_key_1) for mainnet testing"
priority = "medium"
tags = ["key", "test"]

[[spec]]
id = "REQ_ECDSA_KEY_004"
description = "Support local key (dfx_test_key) for development"
priority = "medium"
tags = ["key", "local"]

# =============================================================================
# Derivation Path
# =============================================================================

[[spec]]
id = "REQ_ECDSA_PATH_001"
description = "Support BIP-44 derivation paths"
priority = "high"
tags = ["derivation", "bip44"]

[[spec]]
id = "REQ_ECDSA_PATH_002"
description = "Derive unique keys per EVM chain ID"
priority = "high"
tags = ["derivation", "chain"]

[[spec]]
id = "REQ_ECDSA_PATH_003"
description = "Path format: m/44'/60'/0'/0/{chainId}"
priority = "medium"
tags = ["derivation", "format"]

# =============================================================================
# Signing Operations
# =============================================================================

[[spec]]
id = "REQ_ECDSA_SIGN_003"
description = "Attach correct cycle cost (25B production, 10B test)"
priority = "high"
tags = ["sign", "cycles"]

# =============================================================================
# FFI Bridge
# =============================================================================

[[spec]]
id = "REQ_ECDSA_FFI_002"
description = "C FFI for setting key type"
priority = "high"
tags = ["ffi", "key"]
