# Integration Module Specification
# Full pipeline tests for OUC semantic coverage

[definitions]
prefix = "REQ_INT"

[[spec_area]]
name = "Full Pipeline Integration"

[[spec]]
id = "${prefix}_PIPE_001"
title = "Full proposal -> review -> execution pipeline"
invariant = "Proposal transitions Pending->UnderReview->Approved->Executed with evidence"

[[spec]]
id = "${prefix}_PIPE_002"
title = "Proposal rejection workflow"
invariant = "Rejected proposals have status=Rejected and cannot be executed"

[[spec_area]]
name = "Edge Case Integration"

[[spec]]
id = "${prefix}_EDGE_001"
title = "Empty state handling"
invariant = "Empty state returns empty lists for all queries"

[[spec]]
id = "${prefix}_EDGE_002"
title = "Invalid execution attempt"
invariant = "Execution on non-approved proposal returns InvalidState"

[[spec_area]]
name = "FRC Evidence Chain"

[[spec]]
id = "${prefix}_EVID_001"
title = "Evidence chain preserved through operations"
invariant = "All FR results carry phase, label, and detail"

[[spec_area]]
name = "markExecuted Case Coverage"

[[spec]]
id = "${prefix}_EXEC_001"
title = "markExecuted on approved proposal"
invariant = "Approved proposal can be marked executed"

[[spec]]
id = "${prefix}_EXEC_002"
title = "markExecuted on pending fails"
invariant = "Pending proposal cannot be executed"

[[spec]]
id = "${prefix}_EXEC_003"
title = "markExecuted on rejected fails"
invariant = "Rejected proposal cannot be executed"

[[spec_area]]
name = "submitReview Case Coverage"

[[spec]]
id = "${prefix}_REV_001"
title = "submitReview on UnderReview"
invariant = "UnderReview proposal can receive review"

[[spec]]
id = "${prefix}_REV_002"
title = "submitReview on pending fails"
invariant = "Pending proposal cannot receive review"

[[spec]]
id = "${prefix}_REV_003"
title = "submitReview with RequestChanges"
invariant = "RequestChanges keeps proposal in UnderReview"

[[spec_area]]
name = "getPendingForChain Coverage"

[[spec]]
id = "${prefix}_PEND_001"
title = "getPendingForChain with matching chain"
invariant = "Returns pending proposals for specified chain"

[[spec]]
id = "${prefix}_PEND_002"
title = "getPendingForChain with non-matching chain"
invariant = "Returns empty for different chain"

[[spec]]
id = "${prefix}_PEND_003"
title = "getPendingForChain excludes non-Pending"
invariant = "Only Pending status included"

[[spec]]
id = "${prefix}_PEND_004"
title = "getPendingForChain with multiple proposals"
invariant = "Returns all matching proposals"

[[spec_area]]
name = "recordExecution Coverage"

[[spec]]
id = "${prefix}_RECEX_001"
title = "recordExecution with ExecReverted"
invariant = "Reverted execution returns CallError"

[[spec]]
id = "${prefix}_RECEX_002"
title = "recordExecution with ExecTimeout"
invariant = "Timeout execution returns Timeout failure"

[[spec]]
id = "${prefix}_RECEX_003"
title = "recordExecution with RPC error"
invariant = "RPC error returns CallError"

[[spec_area]]
name = "getAwaitingReview Coverage"

[[spec]]
id = "${prefix}_AWAIT_001"
title = "getAwaitingReview with UnderReview proposals"
invariant = "Returns proposals in UnderReview status"

[[spec]]
id = "${prefix}_AWAIT_002"
title = "getAwaitingReview excludes Approved"
invariant = "Approved proposals not included"

[[spec_area]]
name = "AuditorPool Registration Coverage"

[[spec]]
id = "${prefix}_POOL_001"
title = "registerAuditor with sufficient stake"
invariant = "Auditor with stake >= minStake is registered successfully"

[[spec]]
id = "${prefix}_POOL_002"
title = "registerAuditor with insufficient stake"
invariant = "Auditor with stake < minStake returns Unauthorized"

[[spec]]
id = "${prefix}_POOL_003"
title = "registerAuditor duplicate"
invariant = "Re-registering existing auditor returns Conflict"

[[spec_area]]
name = "AuditorPool Selection Coverage"

[[spec]]
id = "${prefix}_POOL_004"
title = "selectAuditor ByReputation"
invariant = "ByReputation selects auditor with highest reputation"

[[spec]]
id = "${prefix}_POOL_005"
title = "selectAuditor ByAvailability"
invariant = "ByAvailability selects auditor with fewest reviews"

[[spec]]
id = "${prefix}_POOL_006"
title = "selectAuditor with no auditors"
invariant = "Empty pool returns NotFound"

[[spec]]
id = "${prefix}_POOL_007"
title = "selectAuditor Weighted"
invariant = "Weighted selects by reputation * stake"

[[spec_area]]
name = "AuditorPool Slashing Coverage"

[[spec]]
id = "${prefix}_POOL_008"
title = "slashAuditor success"
invariant = "Slashing deducts slashPercentage and sets status=Slashed"

[[spec]]
id = "${prefix}_POOL_009"
title = "slashAuditor not found"
invariant = "Slashing non-existent auditor returns NotFound"

[[spec_area]]
name = "AuditorPool Status Transitions"

[[spec]]
id = "${prefix}_POOL_010"
title = "suspendAuditor success"
invariant = "Active auditor can be suspended"

[[spec]]
id = "${prefix}_POOL_011"
title = "reactivateAuditor from Suspended"
invariant = "Suspended auditor can be reactivated"

[[spec]]
id = "${prefix}_POOL_012"
title = "reactivateAuditor from Slashed fails"
invariant = "Slashed auditor cannot be reactivated"

[[spec_area]]
name = "AuditorPool Reputation Updates"

[[spec]]
id = "${prefix}_POOL_013"
title = "updateReputation positive delta"
invariant = "Positive delta increases reputation"

[[spec]]
id = "${prefix}_POOL_014"
title = "updateReputation negative delta"
invariant = "Negative delta decreases reputation"

[[spec]]
id = "${prefix}_POOL_015"
title = "updateReputation caps at 1000"
invariant = "Reputation cannot exceed 1000"

[[spec_area]]
name = "Rewards Fee Collection"

[[spec]]
id = "${prefix}_RWD_001"
title = "collectFee with sufficient amount"
invariant = "Fee >= proposalFee is collected and treasury updated"

[[spec]]
id = "${prefix}_RWD_002"
title = "collectFee with insufficient amount"
invariant = "Fee < proposalFee returns Unauthorized"

[[spec_area]]
name = "Rewards Queue Management"

[[spec]]
id = "${prefix}_RWD_003"
title = "queueReward with existing fee"
invariant = "Reward is queued when fee exists for proposal"

[[spec]]
id = "${prefix}_RWD_004"
title = "queueReward without fee"
invariant = "Queueing reward without fee returns NotFound"

[[spec_area]]
name = "Rewards Distribution"

[[spec]]
id = "${prefix}_RWD_005"
title = "distributeReward with pending reward"
invariant = "Pending reward is distributed and removed from queue"

[[spec]]
id = "${prefix}_RWD_006"
title = "distributeReward with no pending"
invariant = "Distributing non-existent reward returns NotFound"

[[spec]]
id = "${prefix}_RWD_007"
title = "getPendingReward returns sum"
invariant = "Returns sum of all pending rewards for auditor"

[[spec]]
id = "${prefix}_RWD_008"
title = "getTreasuryBalance"
invariant = "Returns correct treasury balance after fees"

[[spec]]
id = "${prefix}_RWD_009"
title = "calculateReward with bonuses"
invariant = "Quality and speed bonuses increase reward"

[[spec_area]]
name = "Proposal Validation"

[[spec]]
id = "${prefix}_VAL_001"
title = "validateProposal with valid chain"
invariant = "Proposal on active configured chain returns Valid"

[[spec]]
id = "${prefix}_VAL_002"
title = "validateProposal with unknown chain"
invariant = "Proposal on unconfigured chain returns InvalidChain"

[[spec]]
id = "${prefix}_VAL_003"
title = "validateProposal with inactive chain"
invariant = "Proposal on inactive chain returns InvalidChain"

[[spec]]
id = "${prefix}_VAL_004"
title = "validateProposal with expired proposal"
invariant = "Expired proposal returns ExpiredProposal"

[[spec_area]]
name = "Proposal Count Statistics"

[[spec]]
id = "${prefix}_CNT_001"
title = "countByStatus with Pending"
invariant = "Returns count of proposals with Pending status"

[[spec]]
id = "${prefix}_CNT_002"
title = "countByStatus with UnderReview"
invariant = "Returns count of proposals with UnderReview status"

[[spec]]
id = "${prefix}_CNT_003"
title = "countByStatus with Approved"
invariant = "Returns count of proposals with Approved status"

[[spec]]
id = "${prefix}_CNT_004"
title = "countByStatus with empty state"
invariant = "Returns 0 for all statuses on empty state"
