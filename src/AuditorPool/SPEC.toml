# AuditorPool Module Specification
# Management of auditor registration, selection, and accountability

[definitions]
prefix = "POOL"

[[spec_area]]
name = "Auditor Registration"

[[spec]]
id = "${prefix}_REG_001"
title = "Registration requires minimum stake"
invariant = "registerAuditor fails with Unauthorized if stake < minStakeAmount"

[[spec]]
id = "${prefix}_REG_002"
title = "Duplicate registration prevented"
invariant = "registerAuditor returns Conflict for existing auditor"

[[spec]]
id = "${prefix}_REG_003"
title = "New auditors start with default reputation"
invariant = "Initial reputation = 500 (mid-range)"

[[spec]]
id = "${prefix}_REG_004"
title = "New auditors start as Active"
invariant = "Initial status = Active"

[[spec_area]]
name = "Auditor Selection"

[[spec]]
id = "${prefix}_SEL_001"
title = "Only Active auditors are selectable"
invariant = "getActiveAuditors filters by status == Active"

[[spec]]
id = "${prefix}_SEL_002"
title = "Reputation threshold enforced for selection"
invariant = "Selection excludes auditors with reputation < minReputationScore"

[[spec]]
id = "${prefix}_SEL_003"
title = "Empty pool returns NotFound"
invariant = "selectAuditor returns NotFound when no active auditors"

[[spec]]
id = "${prefix}_SEL_004"
title = "Selection criteria deterministic"
invariant = "Same inputs produce same selection (except Random with same seed)"

[[spec_area]]
name = "Reputation Management"

[[spec]]
id = "${prefix}_REP_001"
title = "Reputation bounded to [0, 1000]"
invariant = "updateReputation clamps result to valid range"

[[spec]]
id = "${prefix}_REP_002"
title = "Non-existent auditor returns NotFound"
invariant = "updateReputation returns NotFound for unknown AuditorId"

[[spec]]
id = "${prefix}_REP_003"
title = "Positive delta increases reputation"
invariant = "delta > 0 implies new_rep >= old_rep (capped at 1000)"

[[spec]]
id = "${prefix}_REP_004"
title = "Negative delta decreases reputation"
invariant = "delta < 0 implies new_rep <= old_rep (floored at 0)"

[[spec_area]]
name = "Slashing"

[[spec]]
id = "${prefix}_SLASH_001"
title = "Slash amount calculated from stake percentage"
invariant = "slashAmount = (stake * slashPercentage) / 100"

[[spec]]
id = "${prefix}_SLASH_002"
title = "Slashed auditor status set to Slashed"
invariant = "slashAuditor sets status = Slashed"

[[spec]]
id = "${prefix}_SLASH_003"
title = "Slash count incremented"
invariant = "slashCount increases by 1 on each slash"

[[spec]]
id = "${prefix}_SLASH_004"
title = "Non-existent auditor returns NotFound"
invariant = "slashAuditor returns NotFound for unknown AuditorId"

[[spec_area]]
name = "Status Transitions"

[[spec]]
id = "${prefix}_STATUS_001"
title = "Suspended auditors can be reactivated"
invariant = "reactivateAuditor succeeds for Suspended -> Active"

[[spec]]
id = "${prefix}_STATUS_002"
title = "Slashed auditors cannot be directly reactivated"
invariant = "reactivateAuditor returns InvalidState for Slashed auditors"

[[spec]]
id = "${prefix}_STATUS_003"
title = "Already active auditor is idempotent"
invariant = "reactivateAuditor for Active auditor returns unchanged list"
