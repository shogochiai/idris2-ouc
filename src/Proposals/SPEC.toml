# Proposals Module Specification
# Cross-chain upgrade proposal lifecycle and routing

[definitions]
prefix = "PROP"

[[spec_area]]
name = "Proposal Receipt (Lifecycle Integration)"

[[spec]]
id = "${prefix}_RECV_001"
title = "receiveFromLifecycle creates receipt with source evidence"
invariant = "ProposalReceipt.sourceEvidence contains LazyEvmLifecycle evidence"

[[spec]]
id = "${prefix}_RECV_002"
title = "Upgrade recommendation equals proposal arrival"
invariant = "LazyEvmLifecycle upgrade suggestion <=> OUC proposal exists"

[[spec]]
id = "${prefix}_RECV_003"
title = "Receipt timestamp recorded"
invariant = "ProposalReceipt.receivedAt = currentTime at reception"

[[spec]]
id = "${prefix}_RECV_004"
title = "Source type tracked accurately"
invariant = "ProposalSource correctly identifies LazyEvmLifecycle vs Direct vs CrossCanister"

[[spec_area]]
name = "Proposal Validation"

[[spec]]
id = "${prefix}_VAL_001"
title = "Unknown chain returns InvalidChain"
invariant = "validateProposal fails for unregistered ChainId"

[[spec]]
id = "${prefix}_VAL_002"
title = "Inactive chain returns InvalidChain"
invariant = "validateProposal fails if ChainConfig.isActive = false"

[[spec]]
id = "${prefix}_VAL_003"
title = "Expired proposals return ExpiredProposal"
invariant = "validateProposal fails if currentTime > expiresAt"

[[spec]]
id = "${prefix}_VAL_004"
title = "Valid proposals return Valid"
invariant = "All checks passing => ValidationResult.Valid"

[[spec_area]]
name = "Proposal Routing"

[[spec]]
id = "${prefix}_ROUTE_001"
title = "routeToAuditor assigns auditor to proposal"
invariant = "Proposal status becomes UnderReview after routing"

[[spec]]
id = "${prefix}_ROUTE_002"
title = "Only Pending proposals can be routed"
invariant = "routeToAuditor fails for non-Pending proposals"

[[spec]]
id = "${prefix}_ROUTE_003"
title = "Routing preserves proposal integrity"
invariant = "Only status field changes; other fields immutable"

[[spec_area]]
name = "Review Processing"

[[spec]]
id = "${prefix}_REV_001"
title = "ApproveUpgrade sets status to Approved"
invariant = "ReviewDecision.ApproveUpgrade => ProposalStatus.Approved"

[[spec]]
id = "${prefix}_REV_002"
title = "RejectUpgrade sets status to Rejected"
invariant = "ReviewDecision.RejectUpgrade => ProposalStatus.Rejected"

[[spec]]
id = "${prefix}_REV_003"
title = "RequestChanges keeps status UnderReview"
invariant = "ReviewDecision.RequestChanges => ProposalStatus.UnderReview"

[[spec]]
id = "${prefix}_REV_004"
title = "Review adds to reviews list"
invariant = "processReview appends Review record to state.reviews"

[[spec_area]]
name = "Cross-Chain Execution"

[[spec]]
id = "${prefix}_EXEC_001"
title = "Only Approved proposals can be executed"
invariant = "prepareExecution fails with InvalidState for non-Approved"

[[spec]]
id = "${prefix}_EXEC_002"
title = "Execution success marks proposal Executed"
invariant = "ExecSuccess => ProposalStatus.Executed"

[[spec]]
id = "${prefix}_EXEC_003"
title = "Execution failure returns classified error"
invariant = "ExecReverted => CallError, ExecTimeout => Timeout"

[[spec]]
id = "${prefix}_EXEC_004"
title = "Success records txHash as evidence"
invariant = "markExecuted receives txHash from ExecSuccess"

[[spec_area]]
name = "Execution Result Classification"

[[spec]]
id = "${prefix}_RES_001"
title = "ExecSuccess carries transaction hash"
invariant = "txHash non-empty on success"

[[spec]]
id = "${prefix}_RES_002"
title = "ExecReverted carries revert reason"
invariant = "reason explains why EVM execution reverted"

[[spec]]
id = "${prefix}_RES_003"
title = "ExecRpcError includes code and message"
invariant = "JSON-RPC error details preserved"

[[spec]]
id = "${prefix}_RES_004"
title = "No unclassified execution failures"
invariant = "All HttpOutcall failures map to ExecutionResult variants"
