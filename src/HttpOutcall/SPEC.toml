# HttpOutcall Specification
# ICP HTTP outcall wrapper with EVM JSON-RPC support

[definitions]
prefix = "HTTP"

[[spec_area]]
name = "HTTP Request Handling"

[[spec]]
id = "${prefix}_REQ_001"
title = "Valid URL required"
invariant = "httpRequest fails with DecodeError for malformed URLs"

[[spec]]
id = "${prefix}_REQ_002"
title = "Timeout enforced"
invariant = "httpRequest fails with Timeout if response exceeds maxResponseBytes wait"

[[spec]]
id = "${prefix}_REQ_003"
title = "Transform function applied"
invariant = "Response body transformed via transform function before return"

[[spec]]
id = "${prefix}_REQ_004"
title = "Rate limiting respected"
invariant = "httpRequest fails with RateLimited when ic0.http_request returns rate limit error"

[[spec_area]]
name = "EVM JSON-RPC Construction"

[[spec]]
id = "${prefix}_RPC_001"
title = "Request ID unique per call"
invariant = "Each JSON-RPC request has unique id field"

[[spec]]
id = "${prefix}_RPC_002"
title = "Method names validated"
invariant = "Only valid eth_* methods accepted in buildRpcRequest"

[[spec]]
id = "${prefix}_RPC_003"
title = "Params properly JSON encoded"
invariant = "buildRpcRequest produces valid JSON with escaped strings"

[[spec_area]]
name = "EVM RPC Error Classification"

[[spec]]
id = "${prefix}_ERR_001"
title = "Standard error codes mapped"
invariant = "RPC error codes -32700 to -32600 map to specific EvmRpcFail variants"

[[spec]]
id = "${prefix}_ERR_002"
title = "Execution reverts captured"
invariant = "Error code 3 maps to RpcExecutionReverted with revert reason"

[[spec]]
id = "${prefix}_ERR_003"
title = "Nonce errors classified"
invariant = "'nonce too low/high' in message maps to RpcNonceTooLow/RpcNonceTooHigh"

[[spec]]
id = "${prefix}_ERR_004"
title = "Gas errors classified"
invariant = "Gas-related messages map to RpcGasTooLow/RpcGasLimitExceeded/RpcUnderpriced"

[[spec_area]]
name = "Transaction Sending"

[[spec]]
id = "${prefix}_TX_001"
title = "Raw tx must be 0x-prefixed"
invariant = "sendRawTransaction fails with DecodeError for non-0x-prefixed input"

[[spec]]
id = "${prefix}_TX_002"
title = "Address format validated"
invariant = "ethCall fails with DecodeError for addresses not matching 0x + 40 hex chars"

[[spec]]
id = "${prefix}_TX_003"
title = "Transaction hash format validated"
invariant = "getTransactionReceipt fails with DecodeError for hashes not matching 0x + 64 hex chars"

[[spec_area]]
name = "Chain Configuration"

[[spec]]
id = "${prefix}_CHAIN_001"
title = "Known chains have config"
invariant = "getChainConfig returns Just for chainId in {1, 8453, 42161}"

[[spec]]
id = "${prefix}_CHAIN_002"
title = "Unknown chains return Nothing"
invariant = "getChainConfig returns Nothing for unregistered chainId"

[[spec]]
id = "${prefix}_CHAIN_003"
title = "Gas price limits enforced"
invariant = "validateUpgradeParams fails if maxGasPrice > chainConfig.maxGasPrice"
