# MultiSig Voting Specification
# n-of-n multisignature voting for upgrade proposals

[definitions]
prefix = "MSIG"

[[spec_area]]
name = "Voting Session Creation"

[[spec]]
id = "${prefix}_SESS_001"
title = "Session requires at least one auditor"
invariant = "createVotingSession fails with InvalidState for empty auditor list"

[[spec]]
id = "${prefix}_SESS_002"
title = "Deadline must be in the future"
invariant = "createVotingSession fails with InvalidState if deadline <= currentTime"

[[spec]]
id = "${prefix}_SESS_003"
title = "Session starts with empty votes"
invariant = "New session has votes = [] and proposerSig = Nothing"

[[spec_area]]
name = "Vote Casting"

[[spec]]
id = "${prefix}_VOTE_001"
title = "Only assigned auditors can vote"
invariant = "castVote fails with Unauthorized for auditors not in requiredVoters"

[[spec]]
id = "${prefix}_VOTE_002"
title = "Double voting prevented"
invariant = "castVote fails with Conflict if auditor already has vote in session"

[[spec]]
id = "${prefix}_VOTE_003"
title = "Expired voting rejected"
invariant = "castVote fails with Timeout if currentTime > deadline"

[[spec]]
id = "${prefix}_VOTE_004"
title = "Vote requires non-empty signature"
invariant = "castVote fails with DecodeError for empty signature"

[[spec_area]]
name = "Proposer Signature"

[[spec]]
id = "${prefix}_PROP_001"
title = "Proposer can only sign once"
invariant = "submitProposerSignature fails with Conflict if already signed"

[[spec]]
id = "${prefix}_PROP_002"
title = "Proposer signature required for completion"
invariant = "isVotingComplete returns false if proposerSig is Nothing"

[[spec]]
id = "${prefix}_PROP_003"
title = "Empty proposer signature rejected"
invariant = "submitProposerSignature fails with DecodeError for empty signature"

[[spec_area]]
name = "Threshold Logic"

[[spec]]
id = "${prefix}_THRESH_001"
title = "Unanimous requires all approvals"
invariant = "Unanimous: isVotingComplete true iff approvals == total && proposerSig present"

[[spec]]
id = "${prefix}_THRESH_002"
title = "Majority requires >50% approvals"
invariant = "Majority: approvals > total/2 && proposerSig present"

[[spec]]
id = "${prefix}_THRESH_003"
title = "Custom threshold m-of-n requires m approvals"
invariant = "Threshold(m,n): approvals >= m && proposerSig present"

[[spec]]
id = "${prefix}_THRESH_004"
title = "Single rejection fails unanimous"
invariant = "isVotingFailed true for Unanimous if any rejection exists"

[[spec_area]]
name = "Signature Aggregation"

[[spec]]
id = "${prefix}_AGG_001"
title = "Aggregation requires proposer signature"
invariant = "aggregateSignatures fails with InvalidState without proposerSig"

[[spec]]
id = "${prefix}_AGG_002"
title = "Aggregation requires voting complete"
invariant = "aggregateSignatures fails with InvalidState if isVotingComplete false"

[[spec]]
id = "${prefix}_AGG_003"
title = "Only approval signatures aggregated"
invariant = "AggregatedSignatures.auditorSigs contains only ApproveUpgrade votes"

[[spec]]
id = "${prefix}_AGG_004"
title = "Signature count matches threshold"
invariant = "verifySignatureCount passes iff signature count meets threshold"
