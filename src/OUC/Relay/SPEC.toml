# OUC Relay Specification
# HttpOutcall relay to OU contract on EVM

[definitions]
prefix = "RELAY"

[[spec_area]]
name = "Calldata Construction"

[[spec]]
id = "${prefix}_CALL_001"
title = "castVote calldata format"
invariant = "buildCastVoteCalldata returns SEL_CAST_VOTE + encoded(proposalId, decision, sigHash)"

[[spec]]
id = "${prefix}_CALL_002"
title = "Empty signature rejected"
invariant = "buildCastVoteCalldata fails with DecodeError for empty sigHash"

[[spec]]
id = "${prefix}_CALL_003"
title = "proposerSig calldata format"
invariant = "buildProposerSigCalldata returns SEL_SUBMIT_PROPOSER_SIG + encoded(proposalId, sigHash)"

[[spec]]
id = "${prefix}_CALL_004"
title = "getStatus calldata format"
invariant = "buildGetStatusCalldata returns SEL_GET_VOTING_STATUS + encoded(proposalId)"

[[spec_area]]
name = "Vote Relay"

[[spec]]
id = "${prefix}_VOTE_001"
title = "Relay looks up chain config"
invariant = "relayVote fails with NotFound for unknown chainId"

[[spec]]
id = "${prefix}_VOTE_002"
title = "Relay builds correct calldata"
invariant = "relayVote calls buildCastVoteCalldata with converted decision"

[[spec]]
id = "${prefix}_VOTE_003"
title = "Decision conversion correct"
invariant = "ApproveUpgrade -> 1, RejectUpgrade -> 2, RequestChanges -> 3"

[[spec_area]]
name = "Auditor API"

[[spec]]
id = "${prefix}_API_001"
title = "getAssignedProposals filters by auditor"
invariant = "Returns only proposals where auditorId in assignedAuditors"

[[spec]]
id = "${prefix}_API_002"
title = "ProposalSummary hides chain details"
invariant = "ProposalSummary contains human-readable fields only"

[[spec]]
id = "${prefix}_API_003"
title = "submitVote resolves chain config"
invariant = "submitVote gets ChainTxConfig from proposal.chainId"

[[spec]]
id = "${prefix}_API_004"
title = "submitVote resolves OU address"
invariant = "submitVote gets OU address from proposal.ou"

[[spec_area]]
name = "Status Query"

[[spec]]
id = "${prefix}_STATUS_001"
title = "queryVotingStatus calls ethCall"
invariant = "queryVotingStatus uses eth_call RPC method"

[[spec]]
id = "${prefix}_STATUS_002"
title = "VotingStatus parsed from result"
invariant = "queryVotingStatus returns (currentVotes, requiredVotes, isComplete)"
